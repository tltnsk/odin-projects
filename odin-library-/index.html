<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Boldonse&family=Bungee+Tint&family=Doto:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:wght@100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Sixtyfour+Convergence:BLED,SCAN,XELA,YELA@9,-52,-4,-47&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <title>Book Collection</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Book collection</h1>
        </div>
        <div class="main-content">
            <div class="button-container">
                <button id="new-book-btn">Add a new Book</button>
            </div>
            <form id="new-book-form" style="display: none;">
                <div class="close-form">
                    <button id="close-form-button">&times;</button>
                </div>
                <div class="title">
                    <label for="title">Title </label>
                    <input type="text" id="title" required>
                </div>
                <div class="author">
                    <label for="author">Author </label>
                    <input type="text" id="author" required>
                </div>
                <div class="pages">
                    <label for="pages">Pages </label>
                    <input type="number" id="pages" required>
                </div>
                <div class="read-check">
                    <label for="read">Read </label>
                    <input type="checkbox" id="read">
                </div>
                <div class="submitBtn">
                    <input type="submit" value="Add Book">
                </div>
            </form>            
            <div class="library">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
